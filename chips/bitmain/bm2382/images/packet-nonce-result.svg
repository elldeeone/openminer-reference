<title id="title">BM2382 nonce result</title><desc id="desc">BM2382 nonce result. CRC5 covers 91 bits from byte 2. Bit 7 of the final byte must be set. Bind chain, work ID, current job, age, prefix and seed before host PoW. Coordinates are not unique owners.</desc>
