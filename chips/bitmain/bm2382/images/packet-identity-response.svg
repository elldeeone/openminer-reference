<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="298" viewBox="0 0 1000 298" role="img" aria-labelledby="title desc">
<title id="title">BM2382 identity response</title><desc id="desc">BM2382 identity response. Expected family marker: 2382. The selector is repeated in bytes 6 and 7. CRC5 covers 59 bits from byte 2, including the final-byte high three bits.</desc>
