<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">BM2382 stock integration and hardware boundary</title><desc id="desc">Block diagram of the stock controller, two qualified serial chains, stock supply and fans. A third board shares power. The site power limit allowed mining with two hashboards. Chip-level electrical requirements remain unknown.</desc>
