<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="598" viewBox="0 0 1000 598" role="img" aria-labelledby="title desc">
<title id="title">BM2382 work packet</title><desc id="desc">BM2382 work packet. CRC16 covers bytes 2–51 and is stored high byte first at bytes 52–53. Seed = (2 × (ID + 1)) &amp; 255. Use the documented two-chain dispatch policy.</desc>
