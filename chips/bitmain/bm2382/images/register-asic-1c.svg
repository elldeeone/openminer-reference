<title id="title">BM2382 ASIC 0x1c · Operating word</title><desc id="desc">BM2382 ASIC 0x1c · Operating word. Bit 20 clear suppressed selected fixed-job output; restoration resumed it. Bit 23 clear retained positive core-02 behaviour in the selected tests. Other functions remain unknown.</desc>
