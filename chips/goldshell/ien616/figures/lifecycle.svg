<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="890" viewBox="0 0 1100 890" role="img">
<title>F04 · Tested startup and stop sequence</title><desc>Runs 52, 66, 89 and 90. Stock preparation is a necessary starting condition.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315666"/></marker></defs>
<style>text {font-family: DejaVu Sans, sans-serif; fill:#16313c} .title {font-size:27px;font-weight:bold} .sub {font-size:15px;fill:#49616c} .head {font-size:19px;font-weight:bold} .body {font-size:17px} .small {font-size:14px} .mono {font-family:DejaVu Sans Mono,monospace;font-size:16px}</style>
<rect width="1100" height="890" fill="#f8fafc"/>
<text x="40" y="47" class="title">F04 · Tested startup and stop sequence</text>
<text x="40" y="76" class="sub">Runs 52, 66, 89 and 90. Stock preparation is a necessary starting condition.</text>
<rect x="40" y="115" width="690" height="95" rx="10" fill="#fff4df" stroke="#946319" stroke-width="2" stroke-dasharray="7 5"/>
<text x="58" y="146" class="head">Stock preparation</text>
<text x="58" y="174" class="body">Independent cold supply start is unknown.</text>
<path d="M 385 212 L 385 234" fill="none" stroke="#315666" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="242" width="690" height="95" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="58" y="273" class="head">Ownership and health</text>
<text x="58" y="301" class="body">Identified stock owners stopped. Direct health and watchdog active.</text>
<path d="M 385 339 L 385 361" fill="none" stroke="#315666" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="369" width="690" height="95" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="58" y="400" class="head">Initializer and admission</text>
<text x="58" y="428" class="body">162 recipe transfers. Count 30. Thirty valid 12100020 replies.</text>
<path d="M 385 466 L 385 488" fill="none" stroke="#315666" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="496" width="690" height="95" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="58" y="527" class="head">Known work, then current mining</text>
<text x="58" y="555" class="body">Check PoW. Maintain cooling, ownership and fresh health.</text>
<path d="M 385 593 L 385 615" fill="none" stroke="#315666" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="623" width="690" height="95" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="58" y="654" class="head">Park and OFF</text>
<text x="58" y="682" class="body">Release owner. Read GPIO 66/67 LOW. Restore fan levels 100.</text>
<rect x="790" y="365" width="270" height="160" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="808" y="396" class="head">Failed gate</text>
<text x="808" y="424" class="body">Stop work.</text>
<text x="808" y="449" class="body">Tested shutdown.</text>
<text x="808" y="474" class="body">Watchdog power cutoff.</text>
<path d="M 738 411 L 780 411" fill="none" stroke="#315666" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 738 538 L 780 473" fill="none" stroke="#315666" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="786" class="body">Last gate: relay OFF / 0 W / 0 A. GPIO LOW does not show rail discharge.</text>
<text x="40" y="823" class="body">Separate next test: cold stock return, run 90. No general warm-return claim.</text>
<text x="40" y="860" class="small">C05/C15 · Sources: R052, R066, R089, R090</text>
</svg>
