<text x="40" y="200" font-size="13" text-anchor="start">NN=00 selects the recorded broadcast form. Directed writes use the specified nonzero address.</text>
<text x="40" y="220" font-size="13" text-anchor="start">CRC covers bytes 0-9. A write echo is separate from a later register read.</text>
