<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img">
<title>F28 · IEN616 result coordinate</title><desc>One recorded run-89 share. This is a logical allocation model, not a physical core map.</desc>
<defs><pattern id="unknown" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f3f4f6"/><path d="M0 8 L8 0" stroke="#dce0e6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#253449"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172533}</style>
<rect width="1000" height="550" fill="white"/>
<text x="40" y="34" font-size="22" text-anchor="start" font-weight="600">F28 · IEN616 result coordinate</text>
<text x="40" y="64" font-size="14" text-anchor="start">One recorded run-89 share. This is a logical allocation model, not a physical core map.</text>
<rect x="40" y="112" width="410" height="70" fill="#e6eef9" stroke="#748398"/>
<text x="58" y="138" font-size="16" text-anchor="start" font-weight="600">Work start</text>
<text x="58" y="165" font-size="18" text-anchor="start">6CCC000000000000</text>
<rect x="40" y="212" width="410" height="70" fill="#e6eef9" stroke="#748398"/>
<text x="58" y="238" font-size="16" text-anchor="start" font-weight="600">Logical source start</text>
<text x="58" y="265" font-size="18" text-anchor="start">6CCC0E0000000000</text>
<rect x="40" y="312" width="410" height="70" fill="#e6eef9" stroke="#748398"/>
<text x="58" y="338" font-size="16" text-anchor="start" font-weight="600">Returned nonce</text>
<text x="58" y="365" font-size="18" text-anchor="start">6CCC0E00720AEB25</text>
<text x="490" y="147" font-size="16" text-anchor="start">Address 15: add (15 - 1) × 2^40.</text>
<text x="490" y="177" font-size="14" text-anchor="start">Arithmetic is modulo 2^64.</text>
<text x="490" y="248" font-size="16" text-anchor="start">Source offset: 00000000720AEB25</text>
<text x="490" y="278" font-size="14" text-anchor="start">offset = nonce - logical source start</text>
<text x="490" y="348" font-size="16" text-anchor="start">Core = (offset &gt;&gt; 1) &amp; 31 = 18</text>
<text x="490" y="378" font-size="14" text-anchor="start">Returned coordinate agrees.</text>
<path d="M245 185 L245 207" fill="none" stroke="#253449" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M245 285 L245 307" fill="none" stroke="#253449" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="920" height="62" fill="url(#unknown)" stroke="#748398" stroke-dasharray="5 4"/>
<text x="60" y="446" font-size="15" text-anchor="start">The result has a separate logical address and core byte.</text>
<text x="60" y="469" font-size="14" text-anchor="start">Physical package count, physical lane count and individual-core control stay unknown.</text>
<text x="40" y="526" font-size="11" text-anchor="start">Sources: R089-JOIN, CORE-MAP-RECEIPT, R078, R079</text>
</svg>
