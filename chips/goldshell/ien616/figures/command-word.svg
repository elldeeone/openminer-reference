<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="265" viewBox="0 0 1000 265" role="img">
<title>F09 · IEN616 work/result command word</title><desc>Bit 0 is the least significant bit. Unknown fields are hatched.</desc>
<defs><pattern id="unknown" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f3f4f6"/><path d="M0 8 L8 0" stroke="#dce0e6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#253449"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172533}</style>
<rect width="1000" height="265" fill="white"/>
<text x="40" y="34" font-size="22" text-anchor="start" font-weight="600">F09 · IEN616 work/result command word</text>
<text x="40" y="64" font-size="14" text-anchor="start">Bit 0 is the least significant bit. Unknown fields are hatched.</text>
<text x="920.0" y="91" font-size="11" text-anchor="middle">0</text>
<text x="864.0" y="91" font-size="11" text-anchor="middle">1</text>
<text x="808.0" y="91" font-size="11" text-anchor="middle">2</text>
<text x="752.0" y="91" font-size="11" text-anchor="middle">3</text>
<text x="696.0" y="91" font-size="11" text-anchor="middle">4</text>
<text x="640.0" y="91" font-size="11" text-anchor="middle">5</text>
<text x="584.0" y="91" font-size="11" text-anchor="middle">6</text>
<text x="528.0" y="91" font-size="11" text-anchor="middle">7</text>
<text x="472.0" y="91" font-size="11" text-anchor="middle">8</text>
<text x="416.0" y="91" font-size="11" text-anchor="middle">9</text>
<text x="360.0" y="91" font-size="11" text-anchor="middle">10</text>
<text x="304.0" y="91" font-size="11" text-anchor="middle">11</text>
<text x="248.0" y="91" font-size="11" text-anchor="middle">12</text>
<text x="192.0" y="91" font-size="11" text-anchor="middle">13</text>
<text x="136.0" y="91" font-size="11" text-anchor="middle">14</text>
<text x="80.0" y="91" font-size="11" text-anchor="middle">15</text>
<rect x="500.0" y="101" width="448.0" height="45" fill="#e6eef9" stroke="#748398"/>
<text x="724.0" y="129" font-size="12" text-anchor="middle">Logical address</text>
<path d="M556.0 101 v7" stroke="#536275"/>
<path d="M612.0 101 v7" stroke="#536275"/>
<path d="M668.0 101 v7" stroke="#536275"/>
<path d="M724.0 101 v7" stroke="#536275"/>
<path d="M780.0 101 v7" stroke="#536275"/>
<path d="M836.0 101 v7" stroke="#536275"/>
<path d="M892.0 101 v7" stroke="#536275"/>
<rect x="276.0" y="101" width="224.0" height="45" fill="#e6eef9" stroke="#748398"/>
<text x="388.0" y="129" font-size="12" text-anchor="middle">Opcode</text>
<path d="M332.0 101 v7" stroke="#536275"/>
<path d="M388.0 101 v7" stroke="#536275"/>
<path d="M444.0 101 v7" stroke="#536275"/>
<rect x="52.0" y="101" width="224.0" height="45" fill="#e6eef9" stroke="#748398"/>
<text x="164.0" y="129" font-size="12" text-anchor="middle">Work slot</text>
<path d="M108.0 101 v7" stroke="#536275"/>
<path d="M164.0 101 v7" stroke="#536275"/>
<path d="M220.0 101 v7" stroke="#536275"/>
<text x="40" y="178" font-size="13" text-anchor="start">Work: opcode 7, address 00. Result: opcode 8, address 01-1E. Slots use 1-15.</text>
<text x="40" y="198" font-size="13" text-anchor="start">The command is a big-endian 16-bit word. Other commands have their own template.</text>
<text x="40" y="226" font-size="11" text-anchor="start">Sources: CODEC, PACKETS</text>
</svg>
