<text x="40" y="200" font-size="13" text-anchor="start">Run 89 sends FFFF in the data word. The source template has 0000. The word function is unknown.</text>
<text x="40" y="220" font-size="13" text-anchor="start">No request CRC. The tested broadcast transfer has 618 bytes.</text>
<text x="40" y="240" font-size="13" text-anchor="start">The receive data can contain a result or the empty echo. Receive offsets can change.</text>
<text x="40" y="268" font-size="11" text-anchor="start">Sources: LAYOUT, R089-NATIVE</text>
