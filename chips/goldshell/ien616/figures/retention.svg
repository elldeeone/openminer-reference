<text x="40" y="76" class="sub">Runs 70, 71 and 75. These are external observations, not an internal circuit.</text>
<text x="40" y="129" class="head">After the selected search completes and before the drain:</text>
<rect x="40" y="155" width="190" height="105" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="58" y="186" class="head">First</text>
<text x="58" y="214" class="body">Stored entry</text>
<rect x="250" y="155" width="190" height="105" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="268" y="186" class="head">Second</text>
<text x="268" y="214" class="body">Stored entry</text>
<rect x="460" y="155" width="190" height="105" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="478" y="186" class="head">Third</text>
<text x="478" y="214" class="body">Stored entry</text>
<rect x="670" y="155" width="190" height="105" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="688" y="186" class="head">Fourth</text>
<text x="688" y="214" class="body">Stored entry</text>
<rect x="880" y="155" width="190" height="105" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="898" y="186" class="head">Latest</text>
<text x="898" y="214" class="body">Stored entry</text>
<text x="40" y="304" class="body">Clean sources: the first four stay. The fifth follows the last candidate before the endpoint.</text>
<text x="40" y="336" class="body">Invalid candidates can occupy stored entries and displace valid candidates.</text>
<rect x="40" y="376" width="475" height="130" rx="10" fill="#e6f3f2" stroke="#2e7776" stroke-width="2"/>
<text x="58" y="407" class="head">Run 75: ten aligned segments</text>
<text x="58" y="435" class="body">At most four valid candidates per source.</text>
<text x="58" y="460" class="body">One more entry for the recorded anomaly.</text>
<text x="58" y="485" class="body">All 475 valid identities recovered.</text>
<rect x="560" y="376" width="500" height="130" rx="10" fill="#fff4df" stroke="#946319" stroke-width="2" stroke-dasharray="7 5"/>
<text x="578" y="407" class="head">Limits</text>
<text x="578" y="435" class="body">One full-range job lost valid results.</text>
<text x="578" y="460" class="body">The storage circuit stays unknown.</text>
<text x="578" y="485" class="body">No universal loss-free operating claim.</text>
<text x="40" y="558" class="small">C12 · Sources: R070, R071, R075, SEGMENT-VECTORS, R075-JOIN</text>
<text x="40" y="589" class="small">Solid: recorded external result. Dashed: untested scope.</text>
